<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="200" height="200" fill="#222" />

    <!-- Hood -->
    <path d="M50 80 Q100 10, 150 80 T150 160 Q100 190, 50 160 T50 80" fill="white" stroke="white" stroke-width="4" />

    <!-- Cat Face -->
    <circle cx="100" cy="100" r="40" fill="#222" stroke="white" stroke-width="4" />

    <!-- Cat Ears -->
    <path transform="rotate(-20, 80, 75)" d="M70 75 L80 45 L90 75 Z" fill="white" stroke="white" stroke-width="4" />
    <path transform="rotate(20, 120, 75)" d="M130 75 L120 45 L110 75 Z" fill="white" stroke="white" stroke-width="4" />

    <!-- Eyes (closed eyes) -->
    <line x1="77" y1="97" x2="93" y2="97" stroke="white" stroke-width="3" />
    <line x1="107" y1="97" x2="123" y2="97" stroke="white" stroke-width="3" />

    <!-- ZZZ for sleeping effect -->
    <text x="160" y="70" font-size="12" font-family="Arial Black" font-weight="bold" fill="white">Z</text>
    <text x="170" y="60" font-size="14" font-family="Arial Black" font-weight="bold" fill="white">Z</text>
    <text x="180" y="50" font-size="16" font-family="Arial Black" font-weight="bold" fill="white">Z</text>

    <!-- Nose -->
    <path d="M95 110 L100 115 L105 110 Z" fill="white" />

    <!-- Mouth -->
    <ellipse cx="100" cy="122" rx="4" ry="5" stroke="white" stroke-width="3" fill="white" />

    <!-- Hood Opening -->
    <path d="M60 90 Q100 50, 140 90 T140 150 Q100 170, 60 150 T60 90" fill="none" stroke="white" stroke-width="4" />

    <!-- Left Side Whiskers -->
    <line x1="60" y1="115" x2="80" y2="112" stroke="white" stroke-width="2" />
    <line x1="60" y1="120" x2="80" y2="117" stroke="white" stroke-width="2" />
    <line x1="60" y1="125" x2="80" y2="122" stroke="white" stroke-width="2" />

    <!-- Right Side Whiskers -->
    <line x1="140" y1="115" x2="120" y2="112" stroke="white" stroke-width="2" />
    <line x1="140" y1="120" x2="120" y2="117" stroke="white" stroke-width="2" />
    <line x1="140" y1="125" x2="120" y2="122" stroke="white" stroke-width="2" />
</svg>